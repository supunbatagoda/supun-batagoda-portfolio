name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Switch to `cache: npm` once frontend/package-lock.json is committed.

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: npm run build

  backend:
    name: Backend — build & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Switch to `cache: npm` once backend/package-lock.json is committed.

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  integration:
    name: Docker Compose — end-to-end smoke test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for backend health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/v1/health; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done
          echo "Backend never became healthy"
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000 -o /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Waiting for frontend... ($i/20)"
            sleep 3
          done
          echo "Frontend never came up"
          exit 1

      - name: Subscribe with a valid email
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            http://localhost:4000/api/v1/subscriptions \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-smoke-test@example.com"}')
          cat response.json
          if [ "$status" != "201" ]; then
            echo "Expected 201, got $status"
            exit 1
          fi

      - name: Re-subscribing the same email is handled gracefully
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            http://localhost:4000/api/v1/subscriptions \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-smoke-test@example.com"}')
          cat response.json
          if [ "$status" != "200" ]; then
            echo "Expected 200 for a duplicate email, got $status"
            exit 1
          fi

      - name: Invalid email is rejected
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            http://localhost:4000/api/v1/subscriptions \
            -H "Content-Type: application/json" \
            -d '{"email":"not-an-email"}')
          cat response.json
          if [ "$status" -lt 400 ]; then
            echo "Expected a 4xx status for an invalid email, got $status"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
