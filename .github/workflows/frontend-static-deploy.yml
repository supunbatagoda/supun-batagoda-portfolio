name: Deploy static frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-static-deploy.yml"
  workflow_dispatch:

concurrency:
  group: frontend-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_DIR: /var/www/meeshlabs/supunbatagoda

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000/api/v1' }}
        run: |
          npm install
          npm run build

      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts
          ACTUAL_FINGERPRINT=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR == 1 { print $2 }')
          if [ "$ACTUAL_FINGERPRINT" != "$VPS_HOST_FINGERPRINT" ]; then
            echo "VPS host fingerprint did not match"
            exit 1
          fi

      - name: Create deployment directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: ssh "$VPS_USERNAME@$VPS_HOST" "mkdir -p '$DEPLOY_DIR'"

      - name: Upload static site
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: rsync -az --delete frontend/out/ "$VPS_USERNAME@$VPS_HOST:$DEPLOY_DIR/"
